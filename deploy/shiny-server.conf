# /etc/shiny-server/shiny-server.conf
# Configurazione di esempio per pubblicare le due versioni dell'app
# Example configuration to publish both versions of the app
#   http://SERVER:3838/iohexol/it/   -> versione italiana
#   http://SERVER:3838/iohexol/en/   -> English version
# Il repository è clonato in / the repository is cloned into: /opt/iohexol_calc
# app_dir pubblica solo l'app (non gli altri file del repository)
# app_dir publishes only the app (not the other files of the repository)

run_as shiny;

server {
  listen 3838;

  location /iohexol/it {
    app_dir /opt/iohexol_calc/it;
    log_dir /var/log/shiny-server;
    # la generazione del report può richiedere alcuni secondi
    app_init_timeout 120;
    app_idle_timeout 600;
  }

  location /iohexol/en {
    app_dir /opt/iohexol_calc/en;
    log_dir /var/log/shiny-server;
    # report generation may take a few seconds
    app_init_timeout 120;
    app_idle_timeout 600;
  }
}
